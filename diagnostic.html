<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIOS Login Diagnostic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        .log {
            max-height: 400px;
            overflow-y: auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        .log-entry {
            color: #f8f8f2;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .log-success { color: #50fa7b; }
        .log-error { color: #ff5555; }
        .log-info { color: #8be9fd; }
        .log-warn { color: #ffb86c; }
        .credentials {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            border: 2px dashed #2196F3;
        }
        .credentials strong {
            color: #1976D2;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DIOS Login Diagnostic Tool</h1>
        <p style="color: #666; margin-bottom: 20px;">
            This tool helps diagnose login issues by testing each component separately.
        </p>

        <div class="section">
            <h2>📋 Test Credentials</h2>
            <div class="credentials">
                <strong>Email:</strong> admin@dios.com<br>
                <strong>Password:</strong> password123
            </div>
        </div>

        <div class="section">
            <h2>🧪 Quick Tests</h2>
            <div class="grid">
                <button onclick="testBackend()">1️⃣ Test Backend</button>
                <button onclick="testCORS()">2️⃣ Test CORS</button>
                <button onclick="testLoginAPI()">3️⃣ Test Login API</button>
                <button onclick="testFrontend()">4️⃣ Open Frontend</button>
            </div>
            <button onclick="runAllTests()" style="width: 100%; background: #28a745; font-size: 18px; padding: 15px;">
                🚀 Run All Tests
            </button>
        </div>

        <div class="section">
            <h2>📊 Test Results</h2>
            <div id="results"></div>
        </div>

        <div class="section">
            <h2>📝 Console Log</h2>
            <button onclick="clearLog()">Clear Log</button>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:8000';
        const API_URL = 'http://localhost:8000/api';
        const FRONTEND_URL = 'http://localhost:3001';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            const icon = {
                success: '✅',
                error: '❌',
                info: 'ℹ️',
                warn: '⚠️'
            }[type] || 'ℹ️';
            entry.textContent = `[${timestamp}] ${icon} ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function showResult(html) {
            document.getElementById('results').innerHTML = html;
        }

        async function testBackend() {
            log('Testing backend connectivity...', 'info');
            showResult('<div class="status info">⏳ Testing backend...</div>');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': window.location.origin
                    }
                });
                
                log(`Backend responded with status: ${response.status}`, 'success');
                showResult(`
                    <div class="status success">
                        <strong>✅ Backend is Running!</strong><br>
                        URL: ${BACKEND_URL}<br>
                        Status: ${response.status}
                    </div>
                `);
            } catch (error) {
                log(`Backend error: ${error.message}`, 'error');
                showResult(`
                    <div class="status error">
                        <strong>❌ Backend Not Accessible</strong><br>
                        Error: ${error.message}<br><br>
                        <strong>Action Required:</strong><br>
                        1. Open terminal in backend folder<br>
                        2. Run: <code>php artisan serve</code>
                    </div>
                `);
            }
        }

        async function testCORS() {
            log('Testing CORS configuration...', 'info');
            showResult('<div class="status info">⏳ Testing CORS...</div>');
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test'
                    })
                });
                
                const corsHeaders = {
                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers')
                };
                
                log('CORS headers received', 'success');
                log(JSON.stringify(corsHeaders, null, 2), 'info');
                
                showResult(`
                    <div class="status success">
                        <strong>✅ CORS is Working!</strong><br>
                        Allow Origin: ${corsHeaders['Access-Control-Allow-Origin'] || 'Not set'}<br>
                        Allow Methods: ${corsHeaders['Access-Control-Allow-Methods'] || 'Not set'}
                    </div>
                    <pre>${JSON.stringify(corsHeaders, null, 2)}</pre>
                `);
            } catch (error) {
                log(`CORS error: ${error.message}`, 'error');
                showResult(`
                    <div class="status error">
                        <strong>❌ CORS Error</strong><br>
                        ${error.message}<br><br>
                        <strong>Action Required:</strong><br>
                        Check backend/config/cors.php includes:<br>
                        <code>'http://localhost:3001'</code>
                    </div>
                `);
            }
        }

        async function testLoginAPI() {
            log('Testing login API with credentials...', 'info');
            showResult('<div class="status info">⏳ Testing login API...</div>');
            
            try {
                log('Sending POST request to /api/login', 'info');
                
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@dios.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                
                log(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                log('Response data: ' + JSON.stringify(data, null, 2), 'info');
                
                if (response.ok && data.success) {
                    localStorage.setItem('test_token', data.data.token);
                    showResult(`
                        <div class="status success">
                            <strong>✅ Login API Working Perfectly!</strong><br>
                            User: ${data.data.user.name}<br>
                            Email: ${data.data.user.email}<br>
                            Token: ${data.data.token.substring(0, 30)}...<br><br>
                            <strong>This means your backend is 100% working!</strong>
                        </div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                } else {
                    showResult(`
                        <div class="status error">
                            <strong>❌ Login Failed</strong><br>
                            Message: ${data.message || 'Unknown error'}<br>
                            Status: ${response.status}
                        </div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                }
            } catch (error) {
                log(`Login API error: ${error.message}`, 'error');
                showResult(`
                    <div class="status error">
                        <strong>❌ Login API Error</strong><br>
                        ${error.message}<br><br>
                        <strong>Possible causes:</strong><br>
                        • Backend not running<br>
                        • CORS not configured<br>
                        • Network error
                    </div>
                `);
            }
        }

        function testFrontend() {
            log('Opening frontend application...', 'info');
            window.open(FRONTEND_URL, '_blank');
            showResult(`
                <div class="status info">
                    <strong>ℹ️ Frontend should open in new tab</strong><br>
                    URL: ${FRONTEND_URL}<br><br>
                    <strong>What to check:</strong><br>
                    1. Press F12 to open DevTools<br>
                    2. Go to Console tab<br>
                    3. Try to login<br>
                    4. Check for error messages
                </div>
            `);
        }

        async function runAllTests() {
            clearLog();
            log('Starting comprehensive test suite...', 'info');
            log('═══════════════════════════════════', 'info');
            
            await testBackend();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testCORS();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testLoginAPI();
            
            log('═══════════════════════════════════', 'info');
            log('All tests completed!', 'success');
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            log('Diagnostic tool loaded', 'success');
            log('Click "Run All Tests" to start', 'info');
        });
    </script>
</body>
</html>
